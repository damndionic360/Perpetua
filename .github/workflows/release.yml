# Publishes the addon to CurseForge (and a GitHub release) whenever ## Version in Perpetua/Perpetua.toc changes on main.
# Bump the version and add a CHANGELOG.md section in the same push; pushes that keep the version do nothing.
#
# Two jobs, because the packager won't package a branch push whose commit is already tagged (it expects a tag run):
#   tag      on a push to main: tags a new version, then starts this workflow again on that tag.
#            (A tag pushed with GITHUB_TOKEN triggers no workflows, but a workflow_dispatch it sends does.)
#   package  on a tag (from the tag job, or a tag you push yourself): packages and uploads it.
name: Release

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' Perpetua/Perpetua.toc | tr -d '\r')
          [ -n "$v" ] || { echo "No ## Version in Perpetua.toc" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v already exists, nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Perpetua $v"
          git push origin "$v"
          gh workflow run release.yml --ref "$v"

  package:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME}"
          awk -v v="$v" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Perpetua $v" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
