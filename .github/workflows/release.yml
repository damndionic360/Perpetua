# Publishes the addon to CurseForge (and a GitHub release) whenever ## Version in Perpetua/Perpetua.toc changes on main.
# Bump the version and add a CHANGELOG.md section in the same push; pushes that keep the version do nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' Perpetua/Perpetua.toc | tr -d '\r')
          [ -n "$v" ] || { echo "No ## Version in Perpetua.toc" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v already exists, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Perpetua ${{ steps.version.outputs.version }}"

      - name: Release notes
        if: steps.version.outputs.new == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Perpetua ${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Package and upload
        if: steps.version.outputs.new == 'true'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag
        if: steps.version.outputs.new == 'true'
        run: git push origin "${{ steps.version.outputs.version }}"
